<!DOCTYPE html>
<html lang="en">
<head>
    <title>Papa's Cupcakeria | Hill College Games</title>
     <link rel="icon" type="image/x-icon" href="/hc-favicon.png">
    <meta charset="UTF-8">

    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "t1fa552jga");
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/ruffle/ruffle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: black; /* Optional */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container object, 
        #game-container embed, 
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // Initialize Ruffle
        const ruffle = RufflePlayer.newest();
        const player = ruffle.createPlayer();

        // Append player and force full screen
        const container = document.getElementById("game-container");
        container.appendChild(player);

        // Load the SWF game
        player.load("/papa-games/papascupcakeria.swf");

        // Force full screen dynamically
        function resizeGame() {
            player.style.width = window.innerWidth + "px";
            player.style.height = window.innerHeight + "px";
        }
        window.addEventListener("resize", resizeGame);
        resizeGame();
    </script>
</body>
</html>
